    <main class="container">
        <div id="imagelist-container" class="card">
            <h3 style="text-align: center; margin-bottom: 1.5rem;">Image Manager</h3>
            
            <!-- Global action buttons -->
            <div class="button-group" style="justify-content: flex-end;">
                <button id="downloadAllBtn" class="download-btn">Download All</button>
                <button id="deleteAllBtn" class="delete-btn">Delete All</button>
            </div>

            <!-- Selected action buttons and select all checkbox -->
            <div class="button-group" style="justify-content: space-between; align-items: center;">
                <div>
                    <button id="downloadSelectedBtn" class="download-btn disabled-btn" disabled>Download Selected</button>
                    <button id="deleteSelectedBtn" class="delete-btn disabled-btn" disabled>Delete Selected</button>
                </div>
                <div style="display: flex; align-items: center;">
                    <input type="checkbox" id="selectAllCheckbox">
                    <label for="selectAllCheckbox" style="margin: 0; font-weight: normal; cursor: pointer;">Select All</label>
                </div>
            </div>

            <ul id="image-list">
                <!-- Image list items will be dynamically generated by JavaScript -->
            </ul>

            <p id="no-images-message" style="text-align: center; color: #555; margin-top: 2rem; display: none;">No images found.</p>
        </div>
    </main>
