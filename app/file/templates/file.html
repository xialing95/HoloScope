<main class="container">
    <div id="imagelist-container" class="card">
    <h3>Image List 
        <button onclick="updateImageList()">Update List</button>
        <button onclick="downloadAllImages()">Download All</button>
        <button onclick="deleteAllImages()">Delete All</button>
    </h3>
    <div class="selection-actions">
        <button onclick="downloadSelected()">Download Selected</button>
        <button onclick="deleteSelected()">Delete Selected</button>
    </div>
        <ul id="image-list">
            {% for image in images %}
            <li>
                <input type="checkbox" class="image-checkbox" data-filename="{{ image }}">
                {{ image }}
                <div>
                    <a href="{{ url_for('file.download', filename=image) }}" download>Download</a>
                    <button onclick="deleteImage('{{ image }}')">Delete</button>
                </div>
            </li>
            {% endfor %}
        </ul>
    </div>
</main>
