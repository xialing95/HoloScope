<div class="card">
    <h3>PiCamera2 Time-lapse</h3>
    <form id="timelapse-form" >
        <ul>
            <li>
                <label for="filename">Filename</label>
                <input type="text" id="filename" name="filename" placeholder="microbes, location, etc.">
            </li>
        
            <li>
                <label for="duration">Total Run Time (seconds)</label>
                <input type="number" id="duration" name="duration" placeholder="60" value="60">
            </li>
        
            <li>
                <label for="interval" class="block text-sm font-medium text-gray-700">Interval Between Shots (seconds)</label>
                <input type="number" id="interval" name="interval" placeholder="10" value="10">
            </lv>
        
        <div>
            <button type="submit" id="start-button">
                Start Time-lapse
            </button>
            <button type="button" id="stop-button">
                Stop Time-lapse
            </button>
        </div>
    </form>
    
    <div id="status-container">
        <div id="message-box">
            <p>Ready to start.</p>
        </div>
        <div id="progress-container">
            <p>Progress:</p>
            <div>
                <span id="photo-status">
                    0/0
                </span>
            </div>
        </div>
    </div>
</div>
