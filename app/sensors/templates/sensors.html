<main class="container">
    <div class="card">
        <h3>Current Environmental Data</h3>
        <div class="sensor-data">
            <p>Temperature: <span id="temp">{{temp}}°C</span></p>
            <p>Humidity: <span id="humidity">{{humidity}}%</span></p>
            <p>Pressure: <span id="pressure">{{pressure}}hPa</span></p>
        </div>
        <form method="POST" action="/sensors/reset_i2c">
            <input type="submit" class="button" name="reset_i2c" value="Reset I2C">
        </form>
    </div>
    
    <div class="card">
        <h3>Sensor Data Logging</h3>
        <form id="logging-form" method="POST" action="/sensors/startEnvSensor">
            <div class="form-group">
                <label for="sensor_duration">Duration (seconds):</label>
                <input type="number" id="sensor_duration" name="sensor_duration" placeholder="60" required>
            </div>
            <div class="form-group">
                <label for="sensor_interval">Interval (seconds):</label>
                <input type="number" id="sensor_interval" name="sensor_interval" placeholder="10" required>
            </div>
            <button type="submit">Start Log</button>
        </form>
        <div id="status-message"></div>
        <pre id="log-output"></pre>
    </div>
</main>
